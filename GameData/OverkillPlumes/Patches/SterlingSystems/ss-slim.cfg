// Sterling IPE-GC "Slim" (strl-eng-375-ccgc)

// SS-ONLY PATCH & SWITCHER
@PART[strl-eng-375-ccgc]:NEEDS[Waterfall,SterlingSystems,B9PartSwitch,!StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = basicEngine
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = basicEngine
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
        TEMPLATE
        {
            name = plume
            templateName = overkill-nuclear
            position = 0,0,0
            rotation = -90, 0, 0
            scale = 0.95, 0.95, 0.95
        }
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = High-Flow Hydrogen
            secondaryColor = 0.885294199,0.850000024,1  // #e2d9ff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Increased Flow-Rate Hydrogen Fuel Exhaust
            descriptionDetail = A closed-cycle core survives by keeping its fissile plasma wrapped in a thin "curtain" of flowing propellant. The engineers at MITOS just thickened that curtain and called it a day.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0.5
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}

// SS + SWE PATCH
@PART[strl-eng-375-ccgc]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[basicEngine]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
    }
}

