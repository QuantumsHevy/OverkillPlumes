// Sterling IPE-GC "Slim" (strl-eng-375-ccgc)

@PART[strl-eng-375-ccgc]:NEEDS[Waterfall,SterlingSystems,B9PartSwitch,!StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = basicEngine
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = basicEngine
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = 0.7, 1
        }
        TEMPLATE
        {
            name = plume
            templateName = overkill-null
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 1, 1, 1
        }
    }

    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Flooded Hydrogen
            secondaryColor = 0.885294199,0.850000024,1  // #e2d9ff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Flooded Hydrogen Fuel Exhaust
            descriptionDetail = A closed-cycle core survives by keeping its fissile plasma wrapped in a thin 'curtain' of flowing propellant. The engineers at MITOS just thickened that curtain and called it a day. The containment holds true, and the extra flow buys us a plume worth bragging about.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 0.95, 0.95, 0.95
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrogen
            secondaryColor = #fba7ef
            primaryColor = #ffc1dd
            descriptionSummary = Standard Hydrogen Fuel Exhaust
            descriptionDetail = No hard feelings. Without Stock Waterfall Effects, Sterling Systems leaves the exhaust effect to the glow of the nozzle itself. Still quite a display to behold.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This nimiety skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0.5
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}

@PART[strl-eng-375-ccgc]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[basicEngine]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
    }
}

