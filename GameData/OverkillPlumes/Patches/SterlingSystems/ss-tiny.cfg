// Sterling IPE-GC 'Tiny' Open-Cycle Gas Core Engine (strl-eng-375-ocgc)

@PART[strl-eng-375-ocgc]:NEEDS[Waterfall,SterlingSystems,B9PartSwitch,!StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Flooded Hydrogen
            secondaryColor = 0.885294199,0.850000024,1  // #e2d9ff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Flooded Hydrogen Fuel Exhaust
            descriptionDetail = Simply putting more fuel through a nuclear engine really does mean there will be more exhaust to push out, which also means a plume that looks just that little bit more dramatic.
            MODULE
            {
                name = ModuleWaterfallFX
                moduleID = basicEngine
                CONTROLLER
                {
                    name = atmosphereDepth
                    linkedTo = atmosphere_density
                }
                CONTROLLER
                {
                    name = throttle
                    linkedTo = throttle
                    engineID = basicEngine
                }
                CONTROLLER
                {
                    name = random
                    linkedTo = random
                    range = 0.7, 1
                }
                TEMPLATE
                {
                    name = plume
                    templateName = overkill-stock-nerv
                    position = 0,0,-1.5
                    rotation = 0, 0, 0
                    scale = 2.5, 2.5, 2.5
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = None
            secondaryColor = 0.45073992,0.606730163,1   // #73a0ff
            primaryColor = 0.59852016,0.746300399,1     // #99beff
            descriptionSummary = 
            descriptionDetail = 
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This nimiety skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                name = ModuleWaterfallFX
                moduleID = basicEngine
                CONTROLLER
                {
                    name = atmosphereDepth
                    linkedTo = atmosphere_density
                }
                CONTROLLER
                {
                    name = throttle
                    linkedTo = throttle
                    engineID = basicEngine
                }
                CONTROLLER
                {
                    name = random
                    linkedTo = random
                    range = 0.7, 1
                }
                TEMPLATE
                {
                    name = plume
                    templateName = overkill-antimatter
                    position = 0,0,-1.5
                    rotation = 0, 0, 0
                    scale = 0.125, 0.125, 0.125
                }
            }
        }
    }
}

@PART[strl-eng-375-ocgc]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[basicEngine]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
    }
}

@PART[strl-eng-375-ocgc]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects,B9PartSwitch]:AFTER[SterlingSystems]
