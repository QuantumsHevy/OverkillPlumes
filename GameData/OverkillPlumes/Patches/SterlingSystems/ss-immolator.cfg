// Sterling ISME-BC 'Immolator' (strl-eng-1000-bcam)

// BASE PATCH + SWITCHER
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,B9PartSwitch,!StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = AntimatterBeam
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = AntimatterBeam
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = 0.7, 1
        }
        TEMPLATE
        {
            name = plume
            templateName = overkill-null
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 1, 1, 1
        }
    }

    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Complete Antimatter Beam Exhaust
            descriptionDetail = The Immolator already runs hotter than most reactors dare to. MITOS literally just asked the team at Sterling to push it just a little further, to make sure every little drop of propellant gets its fair share of annihilation.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1.25
                        rotation = -90, 0, 0
                        scale = 0.5, 0.5, 0.5
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = #ffc1dd
            primaryColor = #ffffff
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = No hard feelings. Without Stock Waterfall Effects, Sterling Systems leaves the antimatter glow to the red-hot (or white-hot) nozzle. Still quite a display to behold.
        }
    }
}

// SWE PATCH
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[AntimatterBeam]]
    {
        @TEMPLATE:HAS[#templateName[srtl-bcam]]
        {
            name = plume
        }
    }
}

// SWE SWITCHER
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects,B9PartSwitch]:AFTER[SterlingSystems]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Complete Antimatter Beam Exhaust
            descriptionDetail = The Immolator already runs hotter than most reactors dare to. MITOS literally just asked the team at Sterling to push it just a little further, to make sure every little drop of propellant gets its fair share of annihilation.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1.25
                        rotation = -90, 0, 0
                        scale = 0.5, 0.5, 0.5
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = 0.489269316,0.180392146,0.627451003    // #7d2e9f
            primaryColor = 0.717647076,0.698039234,0.956862748      // #b7b2f4
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = No hard feelings. This is the plume that Stock Waterfall Effects has for the Immolator, which keeps its antimatter dosing at whatever Sterling Systems considers reasonable.
        }
    }
}