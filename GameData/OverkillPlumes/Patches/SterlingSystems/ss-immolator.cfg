// Sterling ISME-BC 'Immolator' (strl-eng-1000-bcam)

// SS-ONLY PATCH + REPLACEMENT
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,!StockWaterfallEffects,!ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = AntimatterBeam
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = AntimatterBeam
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
        TEMPLATE
        {
            name = plume
            templateName = overkill-antimatter
            position = 0,0,1.25
            rotation = -90, 0, 0
            scale = 0.5, 0.5, 0.5
        }
    }
}

// SS + IP PATCH & SWITCHER
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,B9PartSwitch,!StockWaterfallEffects,ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = AntimatterBeam
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = AntimatterBeam
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
        TEMPLATE
        {
            name = plume
            templateName = overkill-antimatter
            position = 0,0,1.25
            rotation = -90, 0, 0
            scale = 0.5, 0.5, 0.5
        }
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Complete Antimatter Beam Exhaust
            descriptionDetail = Since Sterling Age was pretty much in the same boat as PKMC, MITOS started a three-way collaboration to give the most impressive antimatter engine the most impressive antimatter plume.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1.25
                        rotation = -90, 0, 0
                        scale = 0.5, 0.5, 0.5
                    }
                }
            }
        }
        SUBTYPE
        {
            name = interstellar
            title = True Antimatter
            secondaryColor = 0.741176486,0.0745098069,0.937254906    // #bd13ef
            primaryColor = 0.882352948,0.0470588244,0.941176474      // #e10bf0
            descriptionSummary = Interstellar Plumes BCAM Exhaust
            descriptionDetail = A design that showed up on a desk at MITOS with no paperwork attached. Whoever built it seems to have skipped the theatrics entirely. How humble.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = BCAMSterling
                        position = 0,0,0
                        rotation = 0, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
    }
}

// SS + SWE PATCH
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[AntimatterBeam]]
    {
        @TEMPLATE
        {
            name = plume
        }
    }
}

// SS + SWE SWITCHER
@PART[strl-eng-1000-bcam]:NEEDS[Waterfall,SterlingSystems,StockWaterfallEffects,B9PartSwitch,!ZZZ_InterstellarPlumes]:AFTER[SterlingSystems]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Complete Antimatter Beam Exhaust
            descriptionDetail = Since Sterling Age was pretty much in the same boat as PKMC, MITOS started a three-way collaboration to give the most impressive antimatter engine the most impressive antimatter plume.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1.25
                        rotation = -90, 0, 0
                        scale = 0.5, 0.5, 0.5
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = 0.489269316,0.180392146,0.627451003    // #7d2ea0
            primaryColor = 0.589269316,0.280392146,0.727451003      // #9647b9
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = The antimatter beam that Sterling Age built on its own. Still every bit as lethal, just without the extra marketing budget MITOS likes to raise.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = srtl-bcam
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
    }
}

