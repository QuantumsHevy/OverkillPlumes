// X-42 'Niven' Nuclear Salt Water Rocket Engine (fft-nswr-2)
@PART[fft-nswr-2]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-high-1]]
        {
            @templateName = overkill-fft-nswr-niven
            @position = 0,0,-6.275
            @rotation = -90, 0, 0
            @scale = 1.75, 0.25, 1.75
        }
    }
}

// X-2 'Heinlein' Nuclear Salt Water Rocket Engine (fft-nswr-1)
@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-low-1]]
        {
            @templateName = overkill-fft-nswr-heinlein
            @position = 0,0,0
            @rotation = -90, 0, 0
            @scale = 1, 0.25, 1
        }
    }
}