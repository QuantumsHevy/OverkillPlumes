// Mk-55 'Thud' Liquid Fuel Engine (radialLiquidEngine1-2)

// STOCK PATCH
@PART[radialLiquidEngine1-2]:NEEDS[Waterfall,StockWaterfallEffects]:AFTER[StockWaterfallEffects]
{
    !MODULE[ModuleWaterfallFX]:HAS[#moduleID[thudEngine]],* {}
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = thudEngine
        TEMPLATE
        {
            templateName = stock-aerozine50-lower-1
            overrideParentTransform = thrustTransform
            position = 0,0,0.075
            rotation = 0, 0, 0
            scale = 0.315, 0.315, 0.315
            name = plume
        }
        TEMPLATE
        {
            templateName = stock-hypergolic-core
            overrideParentTransform = thrustTransform
            position = 0,0.0016,0.077
            rotation = 0, 0, 0
            scale = 0.313, 0.313, 0.28
            name = plumeCore
        }
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = basicEngine
            responseRateUp = 3
            responseRateDown = 6
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
    }
}

// STOCK SWITCHER
@PART[radialLiquidEngine1-2]:NEEDS[Waterfall,StockWaterfallEffects,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Hydrolox
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = Adapted Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = MITOS judged the original hypergolic mix "too temperamental" to push any further, so the "fix" was simply to feed the Thud the same hydrolox blend that runs through the rest of the catalog. Unfortunately, it does little to actually improve performance.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-lfox
                        position = 0,0,0.075
                        rotation = -90, 0, 0
                        scale = 0.19, 0.19, 0.19
                    }
                    TEMPLATE
                    {
                        name = plumeCore
                        templateName = overkill-null
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Aerozine50
            secondaryColor = #d5942c
            primaryColor = #ddb679
            descriptionSummary = Original Hypergolic Fuel Exhaust
            descriptionDetail = The original hypergolic blend from Rockomax, straight from the original failed design by Eumon Kerman himself. MITOS also gave up trying to fix it.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0.1
                        rotation = -90, 0, 0
                        scale = 0.025, 0.025, 0.025
                    }
                    TEMPLATE
                    {
                        name = plumeCore
                        templateName = overkill-null
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
    }
}