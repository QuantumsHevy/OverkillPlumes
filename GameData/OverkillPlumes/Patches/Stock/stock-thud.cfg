// Reaction Engines LV-1R 'Thud' Radial Mounted Liquid Fuel Engine (radialLiquidEngine1-2)

// STOCK PATCH
@PART[radialLiquidEngine1-2]:NEEDS[Waterfall,StockWaterfallEffects]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[thudEngine]]
    {
        @TEMPLATE:HAS[#templateName[stock-Aerozine50-lower-1]]
        {
            name = plume
        }
        @TEMPLATE:HAS[#templateName[stock-hypergolic-core]]
        {
            name = plumeCore
        }
    }
}

// STOCK SWITCHER
@PART[radialLiquidEngine1-2]:NEEDS[Waterfall,StockWaterfallEffects,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Overpressured
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = High Pressure Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = TODO
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-lfox
                        position = 0,0,0.075
                        rotation = -90, 0, 0
                        scale = 0.19, 0.19, 0.19
                    }
                    TEMPLATE
                    {
                        name = plumeCore
                        templateName = overkill-null
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Aerozine 50
            secondaryColor = 1,0,1
            primaryColor = 0,0,0
            descriptionSummary = Standard Hypergolic Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that Stock Waterfall Effects has for the Thud, which mixes its hypergolics in the proportions the manual actually recommends.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This nimiety skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1
                        rotation = -90, 0, 0
                        scale = 0.1, 0.1, 0.1
                    }
                    TEMPLATE
                    {
                        name = plumeCore
                        templateName = overkill-null
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
    }
}