// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        @TEMPLATE:HAS[#templateName[stock-hydrolox-core-3]]
        {
            name = core
        }
    }
}

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.419838518,0.60981071,0.823529422
            primaryColor = 0.980392158,0.989619434,1
            descriptionSummary = Overkill Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX moduleID = m1FX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-rhino-upper
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                    TEMPLATE
                    {
                        name = core
                        templateName = overkill-stock-rhino-core
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 0.5,0.5,0.5
            primaryColor = 0.8,0.8,0.8
            descriptionSummary = Stock Hydrolox Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}

