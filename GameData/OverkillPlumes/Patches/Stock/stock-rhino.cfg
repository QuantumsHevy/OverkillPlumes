// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 0.84
            %responseRateDown = 2.8
        }
    }
}

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = #title-shorthand
            secondaryColor = 1,0,1
            primaryColor = 0,0,0
            descriptionSummary = #title-longhand
            descriptionDetail = #overkill-description
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-rhino
                        position = 0,0,1.05
                        rotation = -90, 0, 0
                        scale = 1.125, 5, 1.125
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrolox
            secondaryColor = 0.0543343313,0.395755231,0.862962961
            primaryColor = 0.41481483,0.622880638,1
            descriptionSummary = Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Stock Waterfall Effects.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.49, 0.769, 1
            primaryColor = 0.886, 0.949, 1
            descriptionSummary = Faux-Antimatter Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This kit skims the fuel feed through a compact pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
    }
}

