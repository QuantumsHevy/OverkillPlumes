// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 0.84
            %responseRateDown = 2.8
        }
    }
}

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = TODO: Add fuelShorthand title
            secondaryColor = 1,0,1  // #ff00ff
            primaryColor = 0,0,0    // #000000
            descriptionSummary = TODO: Add fuelLonghand title
            descriptionDetail = TODO: Add overkillDescription (high chamber pressure)
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-rhino
                        position = 0,0,1.05
                        rotation = -90, 0, 0
                        scale = 1.125, 5, 1.125
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrolox
            secondaryColor = 0.41481483,0.622880638,1   // #6a9fef
            primaryColor = 0.48273012,0.590310156,1     // #7b97ef
            descriptionSummary = Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = TODO: Add stockDescription (normal chamber pressure)
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Antimatter
            secondaryColor = 0.137254894,0.238754213,1          // #233dff
            primaryColor = 0.631372571,0.78039217,0.980392158   // #a1c7fa
            descriptionSummary = Faux-Antimatter Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This refit skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1.5
                        rotation = -90, 0, 0
                        scale = 0.25, 0.25, 0.25
                    }
                }
            }
        }
    }
}

