// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        @TEMPLATE:HAS[#templateName[stock-hydrolox-core-3]]
        {
            name = core
        }
    }
}

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.5,0.6,0.8
            primaryColor = 1,1,1
            descriptionSummary = Overkill Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX moduleID = m1FX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-rhino-upper
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                    TEMPLATE
                    {
                        name = core
                        templateName = overkill-stock-rhino-core
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 0.41481483,0.622880638,1
            primaryColor = 0.48273012,0.590310156,1
            descriptionSummary = Stock Hydrolox Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}

// SHELVED - see GitHub issue number 3: confirmed in testing (KSP.log, 2026-08-04) that the :LAST pass
// from ModuleManager is a single global bucket ordered alphabetically by folder/subfolder/filename
// across ALL mods, not per-modname. Rhino_Restock.cfg (from SWE) runs in that bucket at 13:07:50.734,
//after our patch at 13:07:49.809, and rebuilds ModuleWaterfallFX with the original
// templateName = stock-hydrolox-upper-1, silently reverting the "Overkill" subtype regardless of
// switcher position. There is no reliable, non-fragile fix short of alphabetical-ordering luck or the
// discouraged :FINAL directive - commented out pending a real fix.

