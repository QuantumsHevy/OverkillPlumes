// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

// STOCK PATCH
@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        !THROTTLECONTROLLER:HAS[#name[throttle]] {}
        THROTTLECONTROLLER
        {
            name = throttle
            engineID = KSX
            responseRateUp = 0.1275
            responseRateDown = 0.45
        }
        !CONTROLLER:HAS[#name[random]] {}
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
    }
}

// STOCK SWITCHER
@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Overpressured Hydrolox
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = High-Pressure Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = Somebody at MITOS looked at the alleged pressure limit inside the blast chamber and decided it was more of a pressure suggestion. The Rhino still likes to blow itself up when run for too long, anyway.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-lfox
                        position = 0,0,1.05
                        rotation = -90, 0, 0
                        scale = 1.125, 3, 1.125
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Controlled Hydrolox
            secondaryColor = 0.41481483,0.622880638,1   // #6a9fef
            primaryColor = 0.48273012,0.590310156,1     // #7b97ef
            descriptionSummary = Standard Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = The actual pressure limit that Kerbodyne set after the sea-level test flights that got this engine repurposed as an upper-stage burner in the first place. It still blows up if pushed.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}

