// Kerbodyne KR-2L+ 'Rhino' Liquid Fuel Engine (Size3AdvancedEngine)

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[m1FX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 0.84
            %responseRateDown = 2.8
        }
    }
}

@PART[Size3AdvancedEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Overpressured
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = High-Pressure Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = Somebody looked at the alleged pressure limit inside the blast chamber and decided it was more of a pressure suggestion. The Rhino still likes to blow itself up when run for too long, anyways.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-rhino
                        position = 0,0,1.05
                        rotation = -90, 0, 0
                        scale = 1.125, 3, 1.125
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrolox
            secondaryColor = 0.41481483,0.622880638,1   // #6a9fef
            primaryColor = 0.48273012,0.590310156,1     // #7b97ef
            descriptionSummary = Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that Stock Waterfall Effects has for the Rhino, which keeps its chamber pressure at a number the engineers actually signed off on.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106   // #b600db
            primaryColor = 0.543252587,0.137254894,1    // #8b23ff
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This superfluity skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}

