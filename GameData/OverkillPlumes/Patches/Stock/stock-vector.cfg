// S3 KS-25 'Vector' Liquid Fuel Engine (SSME)
 
// STOCK SWITCHER LATCH
@PART[SSME]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[plumeSwitch]]]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[plumeSwitch]]
    {
        SUBTYPE
        {
            name = overkill
            title = Hydromethalox
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = Hydrogen-Methane-Oxygen Fuel Exhaust
            descriptionDetail = In a bout of additional bullshittery, MITOS found it fitting to take the existing blend options given by Kerbodyne and... well, blend them again. Now you can just straight-up baffle the aerospace industry instead of just revolutionizing it!
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = VectorFX
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-lfox
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 0.84, 2.1, 0.84
                    }
                    TEMPLATE
                    {
                        name = core
                        templateName = stock-methalox-core-2
                        position = 0,0,0
                        rotation = 0, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = VectorFX
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 0.105, 0.105, 0.105
                    }
                    TEMPLATE
                    {
                        name = core
                        templateName = overkill-null
                        position = 0,0,0
                        rotation = 0, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
    }
}
 
