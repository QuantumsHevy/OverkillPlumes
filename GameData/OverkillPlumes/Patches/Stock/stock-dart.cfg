// Kerbodyne T-1 Toroidal Aerospike 'Dart' Liquid Fuel Engine (toroidalAerospike)

// STOCK PATCH
@PART[toroidalAerospike]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[dartFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-aerospike]]
        {
            name = plume
        }
        !CONTROLLER:HAS[#name[throttle]] {}
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = basicEngine
            responseRateUp = 0.22
            responseRateDown = 0.44
        }
    }
}

// STOCK SWITCHER
@PART[toroidalAerospike]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Overpressured
            secondaryColor = 0.235298634,0.775087595,1  // #3cbeff
            primaryColor = 0.80392158,0.942329824,1     // #ccefff
            descriptionSummary = High Pressure Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = TODO
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-lfox
                        position = 0,0,-0.26
                        rotation = -90, 0, 0
                        scale = 0.45, 1, 0.45
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrolox
            secondaryColor = 1,0,1
            primaryColor = 0,0,0
            descriptionSummary = Hydrogen-Oxygen Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that Stock Waterfall Effects has for the Dart, which keeps its shockwave diamonds honest.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This nimiety skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1
                        rotation = -90, 0, 0
                        scale = 0.1, 0.1, 0.1
                    }
                }
            }
        }
    }
}

