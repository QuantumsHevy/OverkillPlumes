// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

// STOCK PATCH
@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
        !CONTROLLER:HAS[#name[throttle]] {}
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = basicEngine
            responseRateUp = 0.22
            responseRateDown = 0.44
        }
        !CONTROLLER:HAS[#name[random]] {}
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
    }
}

// STOCK SWITCHER
@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = High-Flow Hydrogen
            secondaryColor = 0.885294199,0.850000024,1  // #e2d9ff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Increased Flow-Rate Hydrogen Fuel Exhaust
            descriptionDetail = Simply putting more fuel through a nuclear engine really does mean there will be more exhaust to push out, which also means a plume that looks just a little bit more dramatic.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-nuclear
                        position = 0,0,0.825
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Standard Hydrogen
            secondaryColor = 0.45073992,0.606730163,1   // #73a0ff
            primaryColor = 0.59852016,0.746300399,1     // #99beff
            descriptionSummary = Normal Flow-Rate Hydrogen Fuel Exhaust
            descriptionDetail = The factory hydrogen flow rate that Rockomax intended. A flow rate the reactor was actually rated for before MITOS decided the future needed to glow a little brighter.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,1
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}

