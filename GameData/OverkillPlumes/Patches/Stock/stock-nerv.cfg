// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 2.2
            %responseRateDown = 4.4
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.85,0.92,1
            primaryColor = 1,1,1
            descriptionSummary = Flooded Fuel Exhaust
            descriptionDetail = What happens when up the mass flow rate on a nuclear engine past what it can handle? You get a plume that looks more like a nuclear explosion, of course!
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv
                        position = 0,0,0.825
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Overkill
            secondaryColor = 0.85,0.92,1
            primaryColor = 1,1,1
            descriptionSummary = Faux-Antimatter Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every wild idea the new physics allows. This kit skims the fuel feed through a compact pair-production stage, brews just enough antimatter to matter, and detonates it against the rest of the exhaust. It is somehow self-contained, somehow bolt-on, and somehow has not killed anybody yet.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 0.45073992,0.606730163,1
            primaryColor = 0.59852016,0.746300399,1
            descriptionSummary = Liquid Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Stock Waterfall Effects.
        }
    }
}

