// KERBAL ATOMICS PATCH
@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,KerbalAtomics,!NTRsUseLF]:AFTER[zKerbalAtomics]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        !CONTROLLER:HAS[#name[throttle]] {}
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = LH2
            responseRateUp = 0.22
            responseRateDown = 0.44
        }
        !CONTROLLER:HAS[#name[random]] {}
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
    }
}

// KA + RESTOCK PATCH
@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,ReStock,KerbalAtomics,!NTRsUseLF]:HAS[@MODULE[ModuleWaterfallFX]:HAS[#moduleID[nervFX]]]:LAST[zzz_OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nervFX]]
    {
        !CONTROLLER:HAS[#name[throttle]] {}
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = LH2
            responseRateUp = 0.22
            responseRateDown = 0.44
        }
        !CONTROLLER:HAS[#name[random]] {}
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
    }
    // Below disambiguates the ModuleWaterfallFX target, since KerbalAtomics splits the Nerv into two modules (nervFX/nervLFFX) that the bare IDENTIFIER can no longer tell apart.
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[overkillPlumeSwitch]]
    {
        @SUBTYPE[overkill]
        {
            @MODULE:HAS[@IDENTIFIER[ModuleWaterfallFX]]
            {
                @IDENTIFIER { moduleID = nervFX }
            }
        }
        @SUBTYPE[overkillAntimatter]
        {
            @MODULE:HAS[@IDENTIFIER[ModuleWaterfallFX]]
            {
                @IDENTIFIER { moduleID = nervFX }
            }
        }
    }
}