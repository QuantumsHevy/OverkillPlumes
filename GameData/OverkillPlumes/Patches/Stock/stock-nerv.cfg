// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 2.2
            %responseRateDown = 4.4
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 1,0,1
            primaryColor = 0,0,0
            descriptionSummary = LF Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv
                        position = 0,0,0.825
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 0.45073992,0.606730163,1
            primaryColor = 0.59852016,0.746300399,1
            descriptionSummary = LF Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}

