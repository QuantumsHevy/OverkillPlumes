// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

// This should also exclude KerbalAtomics. It changes the NERV internal effect names and module IDs,
// which breaks the patch from SWE the same way (see their issue number 31). KerbalAtomics compatibility
// is not handled in v0.2.0. (see README/Known Issues).

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!KerbalAtomics]:AFTER[StockWaterfallEffects]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,B9PartSwitch,!KerbalAtomics]:AFTER[StockWaterfallEffects]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.419838518,0.60981071,0.823529422
            primaryColor = 0.980392158,0.989619434,1
            descriptionSummary = Overkill Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv-lf
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 0.5,0.5,0.5
            primaryColor = 0.8,0.8,0.8
            descriptionSummary = LF Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,KerbalAtomics,!NTRsUseLF,ReStock]:AFTER[zzKerbalAtomics]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nervFX]]
    {
        @TEMPLATE:HAS[#templateName[waterfall-ka-ntr-lh2-1]]
        {
            name = plume
        }
    }
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nervLFFX]]
    {
        @TEMPLATE:HAS[#templateName[waterfall-ka-ntr-lf-1]]
        {
            name = plume
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,KerbalAtomics,!NTRsUseLF,ReStock,B9PartSwitch]:AFTER[zzKerbalAtomics]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch-KerbalAtomics
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.419838518,0.60981071,0.823529422
            primaryColor = 0.980392158,0.989619434,1
            descriptionSummary = Dense Bimodal Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX moduleID = nervFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv-lh2
                        position = 0,0,0.084
                        rotation = 0,0,0
                        scale = 0.6,0.6,0.8
                    }
                }
            }
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX moduleID = nervLFFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv-lf
                        position = 0,0,0.084
                        rotation = 0,0,0
                        scale = 0.6,0.6,0.8
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = KerbalAtomics
            secondaryColor = 0.5,0.5,0.5
            primaryColor = 0.8,0.8,0.8
            descriptionSummary = Bimodal Hydrogen Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}