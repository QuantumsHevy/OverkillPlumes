// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!KerbalAtomics|!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,B9PartSwitch,!KerbalAtomics|!ReStock]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0.5,0.6,0.8
            primaryColor = 1,1,1
            descriptionSummary = Overkill Exhaust
            descriptionDetail = TODO: write flavor text
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv-lf
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Stock/SWE
            secondaryColor = 1,0.459760666,0.261909634
            primaryColor = 0.59852016,0.746300399,1
            descriptionSummary = LF Exhaust
            descriptionDetail = TODO: write flavor text
        }
    }
}

// SHELVED - see GitHub issue number 2: The :LAST pass from ModuleManager is a single global bucket
// ordered alphabetically by folder/subfolder/filename across ALL mods, not per-modname, so there is no
// reliable, non-fragile way for this patch to guarantee it runs after ReStock/SWE-style :LAST overrides
// without relying on alphabetical luck or the discouraged :FINAL directive. This branch also requires
// ReStock specifically, same as the confirmed broken Rhino ReStock branch, so it is commented out
// pending a real fix rather than risk the same silent-overwrite failure here.

