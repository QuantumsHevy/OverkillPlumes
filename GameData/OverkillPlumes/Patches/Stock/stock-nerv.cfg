// LV-N 'Nerv' Atomic Rocket Motor (nuclearEngine)

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nukeFX]]
    {
        @TEMPLATE:HAS[#templateName[stock-nuclear-upper-2]]
        {
            name = plume
        }
        %CONTROLLER:HAS[#name[throttle]]
        {
            %responseRateUp = 2.2
            %responseRateDown = 4.4
        }
    }
}

@PART[nuclearEngine]:NEEDS[Waterfall,StockWaterfallEffects,!ReStock,B9PartSwitch]:AFTER[StockWaterfallEffects]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Flooded Hydrogen
            secondaryColor = 0.550000012,0.649999976,1
            primaryColor = 0.792156839,0.792156839,1
            descriptionSummary = Flooded Hydrogen Fuel Exhaust
            descriptionDetail = What happens when you crank up the flow rate on a nuclear engine past what it normally handles? You get a plume that looks just that little bit more dramatic.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-stock-nerv
                        position = 0,0,0.825
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Hydrogen
            secondaryColor = 0.45073992,0.606730163,1
            primaryColor = 0.59852016,0.746300399,1
            descriptionSummary = Standard Hydrogen Fuel Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Stock Waterfall Effects, which uses a sane amount of hydrogen for a nuclear engine.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Antimatter
            secondaryColor = 0.49, 0.769, 1
            primaryColor = 0.886, 0.949, 1
            descriptionSummary = Faux-Antimatter Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This kit skims the fuel feed through a compact pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0.125
                        rotation = -90, 0, 0
                        scale = 0.1, 0.1, 0.1
                    }
                }
            }
        }
    }
}

