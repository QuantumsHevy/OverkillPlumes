// X-2 'Heinlein' Nuclear Salt Water Rocket Engine (fft-nswr-1)

@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-low-1]]
        {
            name = plume
        }
    }
}

@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Loaded Uranium
            secondaryColor = 0.980392158,0.989619434,1  // #f9fcff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Loaded Uranium Salt Water Exhaust
            descriptionDetail = Pack your water with as much uranium salt as it can hold and the reaction gets a lot less polite. This is as concentrated as it gets.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-fft-heinlein
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 0.25, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Enriched Uranium
            secondaryColor = 0.278431386,0.278431386,0.501960814    // #47477f
            primaryColor = 0.442529917,0.272536665,0.598621845      // #7151a0
            descriptionSummary = Enriched Uranium Salt Water Exhaust
            descriptionDetail = No hard feelings. This is the plume that Far Future Technologies has for the Heinlein, which only uses weapons-grade enriched uranium.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.543252587,0.137254894,1  // #8b23ff
            primaryColor = 0.71049583,0,0.862745106     // #b600db
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This superfluity skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 0.25, 0.25, 0.25
                    }
                }
            }
        }
    }
}