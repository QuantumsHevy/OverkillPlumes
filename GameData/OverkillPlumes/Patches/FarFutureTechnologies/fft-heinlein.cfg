// X-2 'Heinlein' Nuclear Salt Water Rocket Engine (fft-nswr-1)

// FFT PATCH
@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-low-1]]
        {
            name = plume
        }
        !CONTROLLER:HAS[#name[throttle]] {}
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = nswr
            responseRateUp = 0.8
            responseRateDown = 0.8
        }
    }
}

// FFT SWITCHER
@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Saturated Uranium
            secondaryColor = 0.980392158,0.989619434,1  // #f9fcff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Saturated Uranium Salt Water Exhaust
            descriptionDetail = Pack your water with as much uranium salt as it can hold, and the reaction gets a lot less polite. This is as concentrated as it gets before it becomes liquid uranium entirely.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-fft-heinlein
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 0.25, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Enriched Uranium
            secondaryColor = 0.278431386,0.278431386,0.501960814    // #47477f
            primaryColor = 0.442529917,0.272536665,0.598621845      // #7151a0
            descriptionSummary = Enriched Uranium Salt Water Exhaust
            descriptionDetail = The mix that PKMC developed using only weapons-grade enriched uranium. Nice and rated to actually stay a salt water solution instead of becoming a weird nuclear slurry.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Faux-Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Imitation Antimatter Beam Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, its engineers have been chasing every little wild idea that the new physics allows. This little pair-production stage somehow brews enough antimatter to annihilate it completely against the exhaust flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 0.125, 0.125, 0.125
                    }
                }
            }
        }
    }
}