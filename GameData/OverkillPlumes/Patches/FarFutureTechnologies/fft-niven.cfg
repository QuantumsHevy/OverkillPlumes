// X-42 'Niven' Nuclear Salt Water Rocket Engine (fft-nswr-2)

@PART[fft-nswr-2]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-high-1]]
        {
            name = plume
        }
    }
}

@PART[fft-nswr-2]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Loaded Uranium
            secondaryColor = 0.980392158,0.989619434,1  // #f9fcff
            primaryColor = 1,1,1                        // #ffffff
            descriptionSummary = Loaded Uranium Salt Water Exhaust
            descriptionDetail = Pack your water with as much uranium salt as it can hold and the reaction gets a lot less polite. This is as concentrated as it gets.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-fft-nswr2niven
                        position = 0,0,-6.275
                        rotation = -90, 0, 0
                        scale = 1.75, 0.25, 1.75
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Enriched Uranium
            secondaryColor = 0.00784313772,0.305123895,0.521568656  // #014e85
            primaryColor = 0.42610991,0.417899877,0.639671922       // #6d6aa3
            descriptionSummary = Enriched Uranium Salt Water Exhaust
            descriptionDetail = No hard feelings. This is the plume that Far Future Technologies has for the Niven, which only uses weapons-grade enriched uranium.
        }
        SUBTYPE
        {
            name = overkillAntimatter
            title = Antimatter
            secondaryColor = 0.137254894,0.238754213,1          // #233dff
            primaryColor = 0.631372571,0.78039217,0.980392158   // #a1c7fa
            descriptionSummary = Faux-Antimatter Exhaust
            descriptionDetail = Ever since MITOS broke the light barrier, their engineers have been chasing every little wild idea that the new physics allows. This refit skims the fuel feed through a tiny pair-production stage, brews just enough antimatter to matter, and annihilates it against the rest of the fuel flow.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
    }
}