// X-42 'Niven' Nuclear Salt Water Rocket Engine (fft-nswr-2)

@PART[fft-nswr-2]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-high-1]]
        {
            name = plume
        }
    }
}

@PART[fft-nswr-2]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            secondaryColor = 0,0.386928082,0.822222233
            primaryColor = 0.980392158,0.989619434,1
            descriptionSummary = Loaded Uranium Salt Exhaust
            descriptionDetail = Pack your water with as much uranium salt as it can hold, and the reaction gets a lot less polite. This is as concentrated as it gets.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-fft-nswr2niven
                        position = 0,0,-6.275
                        rotation = -90, 0, 0
                        scale = 1.75, 0.25, 1.75
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = FFT
            secondaryColor = 0.00784313772,0.305123895,0.521568656
            primaryColor = 0.42610991,0.417899877,0.639671922
            descriptionSummary = Enriched Uranium Salt Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Far Future Technologies, which only uses weapons-grade enriched uranium.
        }
    }
}