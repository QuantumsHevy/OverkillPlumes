// A-834M 'Frisbee' Antimatter Torch Engine (fft-antimatter-beam-1)

// Unlike the NSWR engines and the stock engines this mod already covers, FFT defines these effects
// inline inside ModuleWaterfallFX rather than behind a swappable TEMPLATE slot. The first patch below
// converts it into one (cloning the original effects into overkill-fft-antimatter-default so nothing
// is lost), which lets the second patch use the exact same B9PartSwitch pattern as every other engine
// in this mod.

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[LowPowerEffect]]
    {
        !EFFECT[flare],*      {}
        !EFFECT[lh2Emit],*    {}    // matches BOTH lh2Emit blocks (FFT names them identically)
        !EFFECT[beam],*       {}
        !EFFECT[outerBeam],*  {}
        !EFFECT[roundFlare],* {}
        !EFFECT[light],*      {}

        TEMPLATE
        {
            name = plume
            templateName = fft-antimatter-beam-original
            position = 0,0,0
            rotation = 0,0,0
            scale = 1,1,1
        }
    }
}

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.49, 0.769, 1
            primaryColor = 0.886, 0.949, 1
            descriptionSummary = Complete Antimatter Exhaust
            descriptionDetail = Using a propietary MITOS technology that ensures equal parts antimatter and matter, this refit picks up where the fuel tanks leave off and ensures absolutely no hydrogen is left un-annihilated.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = 0.494117647,0.388235301,0.772549033
            primaryColor = 0.572549045,0.545098066,0.854901969
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Far Future Technologies, which may or may not forget to account for any leftover reactant.
        }
    }
}