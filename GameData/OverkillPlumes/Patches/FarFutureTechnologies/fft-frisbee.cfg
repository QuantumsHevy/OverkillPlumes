// A-834M 'Frisbee' Antimatter Torch Engine (fft-antimatter-beam-1)

// FFT PATCH
@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,!ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[LowPowerEffect]]
    {
        !EFFECT[flare],*      {}
        !EFFECT[lh2Emit],*    {}
        !EFFECT[beam],*       {}
        !EFFECT[outerBeam],*  {}
        !EFFECT[roundFlare],* {}
        !EFFECT[light],*      {}
        TEMPLATE
        {
            name = plume
            templateName = fft-antimatter-beam-original
            position = 0,0,0
            rotation = 0,0,0
            scale = 1,1,1
        }
        !THROTTLECONTROLLER:HAS[#name[throttle]] {}
        THROTTLECONTROLLER
        {
            name = throttle
            engineID = 
            responseRateUp = 8
            responseRateDown = 4
        }
    }
}

// FFT SWITCHER
@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch,!ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.71049583,0,0.862745106,1         // #b600db
            primaryColor = 0.791098356,0.456747413,0.862745106  // #c97acc
            descriptionSummary = Complete Antimatter Beam Exhaust
            descriptionDetail = Using proprietary MITOS technology that ensures equal parts antimatter and matter, this refit picks up where those expensive antimatter tanks leave off and ensures that absolutely no hydrogen is left unannihilated.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = 0.494117647,0.388235301,0.772549033    // #7e63c5
            primaryColor = 0.572549045,0.545098066,0.854901969      // #938be0
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = The original PKMC factory spec for the multi-kilometre beam with no aftermarket tuning involved. Whether every last atom of reactant finds its antimatter counterpart before it leaves the nozzle is officially a matter for Post-Kerbin Mining alone, same as it ever was.
        }
    }
}

// FFT + IP PATCH
@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,ZZZ_InterstellarPlumes]:LAST[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[AntimatterBeam]]
    {
        @TEMPLATE:HAS[#templateName[BCAM30KM]]
        {
            name = plume
        }
        !THROTTLECONTROLLER:HAS[#name[throttle]] {}
        THROTTLECONTROLLER
        {
            name = throttle
            engineID = 
            responseRateUp = 8
            responseRateDown = 4
        }
    }
}

