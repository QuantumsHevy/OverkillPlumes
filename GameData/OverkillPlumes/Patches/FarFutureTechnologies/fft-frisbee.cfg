// A-834M 'Frisbee' Antimatter Torch Engine (fft-antimatter-beam-1)

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,!ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[LowPowerEffect]]
    {
        !EFFECT[flare],*      {}
        !EFFECT[lh2Emit],*    {}
        !EFFECT[beam],*       {}
        !EFFECT[outerBeam],*  {}
        !EFFECT[roundFlare],* {}
        !EFFECT[light],*      {}

        TEMPLATE
        {
            name = plume
            templateName = fft-antimatter-beam-original
            position = 0,0,0
            rotation = 0,0,0
            scale = 1,1,1
        }
    }
}

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch,!ZZZ_InterstellarPlumes]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = Total Antimatter
            secondaryColor = 0.543252587,0.137254894,1  // #8b23ff
            primaryColor = 0.71049583,0,0.862745106     // #b600db
            descriptionSummary = Absolute Antimatter Beam Exhaust
            descriptionDetail = Using a propietary MITOS technology that ensures equal parts antimatter and matter, this refit picks up where those expensive fuel tanks leave off and ensures absolutely no hydrogen is left un-annihilated.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-antimatter
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 1, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Antimatter
            secondaryColor = 0.494117647,0.388235301,0.772549033    // #7e63c5
            primaryColor = 0.572549045,0.545098066,0.854901969      // #938be0
            descriptionSummary = Antimatter Beam Exhaust
            descriptionDetail = No hard feelings. This is the plume that Far Future Technologies has for the Frisbee, which may or may not forget to account for any leftover reactant matter.
        }
    }
}

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies,Waterfall,ZZZ_InterstellarPlumes]:LAST[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[AntimatterBeam]]
    {
        @TEMPLATE:HAS[#templateName[BCAM30KM]]
        {
            name = plume
        }
    }
}

