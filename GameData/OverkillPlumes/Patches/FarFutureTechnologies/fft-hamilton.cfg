// X-12 'Hamilton' Nuclear Pulse Engine (fft-fission-orion-5-1)

// FFT PATCH
@PART[fft-fission-orion-5-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[FissionPulse]]
    {
        @TEMPLATE:HAS[#templateName[fft-orion-pulse-particle-1]]
        {
            name = plume
        }
    }
}

// FFT SWITCHER
@PART[fft-fission-orion-5-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = false      // Due to a limitation with how KSP handles persistent particles, switching the plume in flight will break both plumes completley and will require a reload of the session to fix.
        SUBTYPE
        {
            name = overkill
            title = Polyethylene
            secondaryColor = 0.507227916,0.658413512,0.960784316    // #81A8F5
            primaryColor = 1,1,1                                    // #FFFFFF
            descriptionSummary = Polyethylene-Propellant Pulse Units
            descriptionDetail = MITOS swapped the tungsten slab in every pulse unit for dense polyethylene before throttling the power of each pulse unit to match the design from PKMC. All that plastic boils away instantly and completely, leaving one very bright flash and no cloud to speak ill of.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-hamilton
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Tungsten
            secondaryColor = 0.16,0.32,0.55                     // #2A528C
            primaryColor = 0.443137258,0.700962543,0.886274517  // #71B3E2
            descriptionSummary = Tungsten-Propellant Pulse Units
            descriptionDetail = PKMC originally mass-produced its nuclear pulse units with a slab of tungsten propellant, since it was dense enough to return the power lost when using weaker, safer warheads.
        }
    }
}