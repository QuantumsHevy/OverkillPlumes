// X-12 'Hamilton' Nuclear Pulse Engine (fft-fission-orion-5-1)

// FFT PATCH
@PART[fft-fission-orion-5-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[FissionPulse]]
    {
        @TEMPLATE:HAS[#templateName[fft-orion-pulse-particle-1]]
        {
            name = plume
        }
    }
}

// FFT SWITCHER
@PART[fft-fission-orion-5-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true
        SUBTYPE
        {
            name = overkill
            title = TODO: Overkill ShortTitle
            secondaryColor = 1,0.407843143,0.0705882311
            primaryColor = 1,0.976470649,0.905882359
            descriptionSummary = TODO: Overkill LongTitle
            descriptionDetail = TODO: Overkill Description
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-hamilton
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1,1,1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = TODO: FFT ShortTitle
            secondaryColor = 0.407843143,0.411764711,0.490196079
            primaryColor = 0.600000024,0.211764723,0.0705882311
            descriptionSummary = TODO: FFT LongTitle
            descriptionDetail = TODO: FFT Description
        }
    }
}