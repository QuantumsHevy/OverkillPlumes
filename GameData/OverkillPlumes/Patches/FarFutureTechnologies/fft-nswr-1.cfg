// X-2 'Heinlein' Nuclear Salt Water Rocket Engine
@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall]:FOR[OverkillPlumes]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[nswrFX]]
    {
        @TEMPLATE:HAS[#templateName[fft-nswr-low-1]]
        {
            name = plume
        }
    }
}

@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies,Waterfall,B9PartSwitch]:FOR[OverkillPlumes]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = overkillPlumeSwitch
        switcherDescription = Plume
        switcherDescriptionPlural = Plumes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = overkill
            title = Overkill
            primaryColor = 0.419838518,0.60981071,0.823529422
            secondaryColor = 0.980392158,0.989619434,1
            descriptionSummary = Plutonium Salt Exhaust
            descriptionDetail = Being just barely more reactive than uranium, plutonium salts allow for a more... 'energetic' exhaust, to say the least.
            MODULE
            {
                IDENTIFIER { name = ModuleWaterfallFX }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = overkill-fft-nswr1heinlein
                        position = 0,0,0
                        rotation = -90, 0, 0
                        scale = 1, 0.25, 1
                    }
                }
            }
        }
        SUBTYPE
        {
            name = default
            title = Far Future Technologies
            primaryColor = 0.278431386,0.278431386,0.501960814
            secondaryColor = 0.442529917,0.272536665,0.598621845
            descriptionSummary = Enriched Uranium Salt Exhaust
            descriptionDetail = No hard feelings. This is the plume that comes with Far Future Technologies, which uses weapons-grade enriched uranium.
            // No MODULE/DATA override: leaves the base fft-nswr-low-1 template untouched.
        }
    }
}