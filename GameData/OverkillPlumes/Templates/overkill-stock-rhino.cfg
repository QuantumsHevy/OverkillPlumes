EFFECTTEMPLATE
{
	templateName = overkill-stock-rhino

	// "core" — the honest hydrolox combustion bloom. Sootless H2/O2 flame: pale, cool,
	// dominated by weak OH-radical chemiluminescence rather than blackbody glow from
	// carbon particles (that's a kerolox trait, not this engine's). Short and fast-fading —
	// true vacuum combustion glow doesn't linger, even before the Overkill excuse is applied.
	EFFECT
	{
		name = core
		parentName = thrustTransform
		MODEL
		{
			path = Waterfall/FX/fx-cylinder
			positionOffset = 0,0,0
			rotationOffset = 0,0,0
			scaleOffset = 0.55,6,0.55
			MATERIAL
			{
				transform = Cylinder
				shader = Waterfall/Additive (Dynamic)
				randomizeSeed = True
				TEXTURE
				{
					textureSlotName = _MainTex
					texturePath = Waterfall/FX/fx-noise-1
					textureScale = 1,1
					textureOffset = 0,0
				}
				COLOR
				{
					colorName = _StartTint
					colorValue = 0.95,0.97,1,1
				}
				COLOR
				{
					colorName = _EndTint
					colorValue = 0.85,0.92,1,1
				}
				FLOAT
				{
					floatName = _Brightness
					value = 6
				}
				FLOAT
				{
					floatName = _Falloff
					value = 6
				}
				FLOAT
				{
					floatName = _SpeedY
					value = 220
				}
				FLOAT
				{
					floatName = _Noise
					value = 0.6
				}
				FLOAT
				{
					floatName = _TintFalloff
					value = 1
				}
				FLOAT
				{
					floatName = _Fresnel
					value = 0
				}
				FLOAT
				{
					floatName = _FresnelInvert
					value = 0
				}
				FLOAT
				{
					floatName = _FadeOut
					value = 2
				}
				FLOAT
				{
					floatName = _ExpandLinear
					value = 15
				}
				FLOAT
				{
					floatName = _ExpandBounded
					value = 0
				}
				FLOAT
				{
					floatName = _ExpandSquare
					value = 0
				}
			}
		}
		FLOATMODIFIER
		{
			floatName = _Brightness
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = throttleBright
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0 0 0
				key = 0.1 0.5 0 0
				key = 1 1 0 0
			}
		}
		FLOATMODIFIER
		{
			floatName = _Brightness
			controllerName = random
			transformName = Cylinder
			useRandomness = True
			randomnessController = RandomnessController
			randomnessScale = 1
			name = flicker
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0.85 0 0
				key = 1 1 0 0
			}
		}
	}

	// "funnel" — the Overkill layer. Not a mixture-ratio trick (oxidizer-rich doesn't
	// brighten a sootless flame) — this is the reaction running at elevated chamber
	// pressure, well past sane limits, pushing a denser, more energetic, more turbulent
	// burn. Visually: an aggressive, continuously widening flare (true unbounded vacuum
	// expansion, no shock diamonds) that thins toward transparency as it widens —
	// bright and dense near the throat, hazy at the flare's outer edge.
	EFFECT
	{
		name = funnel
		parentName = thrustTransform
		MODEL
		{
			path = Waterfall/FX/fx-cylinder
			positionOffset = 0,-1,0
			rotationOffset = 0,0,0
			scaleOffset = 1.2,14,1.2
			MATERIAL
			{
				transform = Cylinder
				shader = Waterfall/Additive (Dynamic)
				randomizeSeed = True
				TEXTURE
				{
					textureSlotName = _MainTex
					texturePath = Waterfall/FX/fx-noise-2
					textureScale = 1,1
					textureOffset = 0,0
				}
				COLOR
				{
					colorName = _StartTint
					colorValue = 0.9,0.95,1,1
				}
				COLOR
				{
					colorName = _EndTint
					colorValue = 0.75,0.85,1,1
				}
				FLOAT
				{
					floatName = _Brightness
					value = 5.5
				}
				FLOAT
				{
					floatName = _Falloff
					value = 2.5
				}
				FLOAT
				{
					floatName = _SpeedY
					value = 80
				}
				FLOAT
				{
					floatName = _Noise
					value = 1.2
				}
				FLOAT
				{
					floatName = _TintFalloff
					value = 2
				}
				FLOAT
				{
					floatName = _Fresnel
					value = 0
				}
				FLOAT
				{
					floatName = _FresnelInvert
					value = 0
				}
				FLOAT
				{
					floatName = _FadeOut
					value = 1
				}
				FLOAT
				{
					floatName = _ExpandLinear
					value = 90
				}
				FLOAT
				{
					floatName = _ExpandBounded
					value = 0
				}
				FLOAT
				{
					floatName = _ExpandSquare
					value = 15
				}
			}
		}
		FLOATMODIFIER
		{
			floatName = _Brightness
			controllerName = throttle
			transformName = Cylinder
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = throttleBright
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0 0 0
				key = 0.1 0.4 0 0
				key = 1 1 0 0
			}
		}
		FLOATMODIFIER
		{
			floatName = _Brightness
			controllerName = random
			transformName = Cylinder
			useRandomness = True
			randomnessController = RandomnessController
			randomnessScale = 1
			name = flicker
			combinationType = MULTIPLY
			floatCurve
			{
				key = 0 0.8 0 0
				key = 1 1 0 0
			}
		}
	}

	// "flare" — billboard bloom at the funnel's origin. Pale white-blue, sized up from
	// Nerv's to match Rhino's greater overall energy output.
	EFFECT
	{
		name = flare
		parentName = thrustTransform
		MODEL
		{
			path = Waterfall/FX/fx-billboard-generic-1
			positionOffset = 0,-2,0
			rotationOffset = 0,0,0
			scaleOffset = 8,30,0
			MATERIAL
			{
				transform = Billboard
				shader = Waterfall/Billboard (Additive)
				randomizeSeed = True
				TEXTURE
				{
					textureSlotName = _MainTex
					texturePath = OverkillPlumes/FX/fx_flareglow-1_hd
					textureScale = 1,1
					textureOffset = 0,0
				}
				COLOR
				{
					colorName = _StartTint
					colorValue = 0.92,0.96,1,1
				}
			}
		}
		SCALEMODIFIER
		{
			controllerName = throttle
			transformName = Billboard
			useRandomness = True
			randomnessController = random
			randomnessScale = 0.1
			name = scaleThrottle
			combinationType = ADD
			xCurve
			{
				key = 0 0.6 0 0
				key = 1 1 0 0
			}
			yCurve
			{
				key = 0 0.6 0 0
				key = 1 1 0 0
			}
			zCurve
			{
				key = 0 0.6 0 0
				key = 1 1 0 0
			}
		}
		COLORMODIFIER
		{
			colorName = _StartTint
			controllerName = throttle
			transformName = Billboard
			useRandomness = False
			randomnessController = random
			randomnessScale = 1
			name = colorThrottle
			combinationType = REPLACE
			rCurve
			{
				key = 0 0 0 0
				key = 0.15 0.6 0 0
				key = 1 0.6 0 0
			}
			gCurve
			{
				key = 0 0 0 0
				key = 0.15 0.65 0 0
				key = 1 0.65 0 0
			}
			bCurve
			{
				key = 0 0 0 0
				key = 0.15 0.7 0 0
				key = 1 0.7 0 0
			}
			aCurve
			{
				key = 0 0 0 0
				key = 0.15 0.65 0 0
				key = 1 0.65 0 0
			}
		}
	}

	// "light" — pale white-blue, highest intensity in the pack. Rhino should be the
	// visually "loudest" engine of the four in raw output, even while staying
	// color-restrained (no warm cast — this is still a clean hydrolox burn).
	EFFECT
	{
		name = light
		parentName = thrustTransform
		MODEL
		{
			path = Waterfall/FX/fx-point-light
			positionOffset = 0,-3,0
			rotationOffset = 0,0,0
			scaleOffset = 1,1,0
			LIGHT
			{
				intensity = 6
				range = 30
				color = 0.92,0.96,1,1
				lightType = Point
				angle = 0
				transform = Light
				baseTransform = 
			}
		}
		LIGHTFLOATMODIFIER
		{
			floatName = Intensity
			controllerName = throttle
			transformName = Light
			useRandomness = False
			randomnessController = RandomnessController
			randomnessScale = 1
			name = tInt
			combinationType = REPLACE
			floatCurve
			{
				key = 0 0 0 0
				key = 0.2 6 0 0
				key = 1 6 0 0
			}
		}
	}
}